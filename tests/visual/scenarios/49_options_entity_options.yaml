id: options_entity_options
description: 'options: Entity options #1'
view_path: options-entity-options

setup:
  - type: ha_service
    domain: light
    service: turn_on
    data:
      entity_id: light.bed_light
      brightness: 255
      color_temp_kelvin: 2631

card:
  type: custom:auto-entities
  card:
    type: entities
    show_header_toggle: false
  filter:
    include:
      - entity_id: light.bed_light
        options:
          name: Lamp
          icon: mdi:lamp

assertions:
  - type: snapshot
    name: 49_options_entity_options
    threshold: 0.02
