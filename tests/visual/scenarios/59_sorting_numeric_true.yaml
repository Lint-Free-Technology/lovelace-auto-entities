id: sorting_numeric_true
description: 'sorting: numeric true treats non-numeric as greater (follows reverse)'
view_path: sorting-numeric-true

cards:
  - type: custom:auto-entities
    card:
      type: entities
      title: numeric true
      show_header_toggle: false
    filter:
      include:
        - entity_id: /sensor\.mix_/
    sort:
      method: state
      numeric: true
  - type: custom:auto-entities
    card:
      type: entities
      title: numeric true reverse
      show_header_toggle: false
    filter:
      include:
        - entity_id: /sensor\.mix_/
    sort:
      method: state
      numeric: true
      reverse: true

assertions:
  - type: snapshot
    name: 59_sorting_numeric_true
    threshold: 0.02
